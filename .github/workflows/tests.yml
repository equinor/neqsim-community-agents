name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Repository structure tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: uv sync --locked

      - name: Run pre-commit hooks (Ruff, Black)
        run: uv run pre-commit run --all-files

      - name: Ensure pre-commit did not modify files
        run: git diff --exit-code

      - name: Run repository structure tests
        run: uv run pytest tests/

      - name: Validate agent manifests
        run: uv run python scripts/validate_agent_manifests.py

      - name: Check agent-skill map is up to date
        run: uv run python scripts/generate_agent_skill_map.py --check

      - name: Check orchestration map is up to date
        run: uv run python scripts/generate_orchestration_map.py --check

  runtime:
    name: Agent runtime and examples (Python 3.10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-repository
    steps:
      - name: Check out agent repository
        uses: actions/checkout@v7
        with:
          path: agent-repository

      - name: Check out public example dependencies
        uses: actions/checkout@v7
        with:
          repository: equinor/neqsim-community-skills
          ref: main
          path: neqsim-community-skills

      - name: Set up uv and Python 3.10
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.10"

      - name: Create isolated end-user test environment
        run: uv venv --python 3.10 .runtime-venv

      - name: Install runtime test and example dependencies
        run: |
          uv pip install --python .runtime-venv/bin/python 'pytest>=8.0' 'PyYAML>=6.0' 'jsonschema>=4.0' \
            ../neqsim-community-skills/skills/field-development/neqsim-reservoir-depletion-screening \
            ../neqsim-community-skills/skills/subsea/neqsim-production-network-routing

      - name: Run agent tests and executable examples
        run: .runtime-venv/bin/python -m pytest -q tests/ runtime_tests/

      - name: Validate agent manifests on Python 3.10
        run: .runtime-venv/bin/python scripts/validate_agent_manifests.py
