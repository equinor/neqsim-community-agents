name: cfd-coupling-agent
description: "Runs single-phase and multiphase CFD from governed engineering inputs, qualifies existing CFD, and assesses aeroacoustic readiness. Tonal-noise cases fail closed unless source topology, internal geometry, synchronized spectra, event conditions, acoustic terminations, and required structural boundaries exist; steady RANS is never used as tonal-source diagnosis."
agent_type: community-agent
required_skills:
- neqsim-cfd-coupling
coordinated_agents:
- flow-assurance-engineer-agent
- fem-coupling-agent
supported_domains:
- cfd
- openfoam
- multiphase-flow
- process-engineering
- flow-assurance
- corrosion-screening
- mesh-quality
- aeroacoustics-readiness
- tonal-noise
inputs:
- pid_component_class_and_tag
- stid_or_tag_register_dimensions
- mechanical_and_process_datasheets
- plant_operating_data
- neqsim_fluid_or_stream
- two_phase_flow_regime
- existing_cfd_report_and_methodology
- synchronized_narrow_band_spectra_for_tonal_cases
- acoustic_and_structural_boundaries_for_coupled_cases
outputs:
- traceable_design_basis
- neqsim_derived_boundary_conditions
- multiphase_model_screening
- openfoam_case_and_run_outcome
- solved_field_results
- cfd_quality_verdict
- aeroacoustic_readiness_verdict
- local_enhancement_factors
- assumptions_and_traceability
human_review_required: true
version: 0.4.0
