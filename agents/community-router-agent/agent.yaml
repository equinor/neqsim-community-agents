supported_domains:
- request classification
- community agent routing
- multi-agent workflow composition
- calculation-rigor selection
- task scoping handoff
inputs:
- plain-language request or task description
- available fluid, operating, or asset data (optional)
- intended deliverable (screening answer, study, report)
- required rigor (screening versus NeqSim-calculation-grade)
outputs:
- selected community agent(s) with rationale
- suggested invocation and the inputs that agent needs
- multi-agent workflow plan when the task spans disciplines
- calculation-basis note (screening versus NeqSim-backed)
- human-review and follow-up-study notes
human_review_required: true
trust_level: community
