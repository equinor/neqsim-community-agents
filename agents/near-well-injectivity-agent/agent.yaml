name: near-well-injectivity-agent
description: "Derives productivity and injectivity indices from the rock with OPM Flow, pyscal and resdata, converts NeqSim fluids to black-oil PVT tables, generates VFPPROD lift curves from NeqSim flowline/tubing models, and hands a defensible inflow relationship to NeqSim well and process models. Use when an inflow number is about to be assumed, injectors vs voidage, productivity decay below bubble point, a VFP table is needed, or a reservoir model must be built and run."
agent_type: community-agent
required_skills:
- neqsim-near-well-and-injectivity
- neqsim-api-patterns
context_skills:
- neqsim-production-optimization
- neqsim-subsea-and-wells
- neqsim-benchmark-reference-data
- neqsim-input-validation
- neqsim-professional-reporting
coordinated_agents:
- reservoir-simulator-agent
- flow-assurance-engineer-agent
supported_domains:
- subsurface
- wells
- injectivity
- productivity
- relative-permeability
- reservoir-engineering
- reservoir-simulation
- black-oil-pvt
- lift-curves
inputs:
- permeability_net_pay_and_drainage_geometry
- relative_permeability_endpoints_or_scal_report
- fluid_viscosities_and_formation_volume_factor
- neqsim_compositional_fluid_or_black_oil_table
- completion_type_drain_length_and_skin
- tubing_flowline_riser_geometry_and_heat_transfer
- voidage_replacement_requirement_over_field_life
- well_test_data_if_available
outputs:
- productivity_index_initial_and_developed
- injectivity_index_initial_and_developed
- endpoint_mobility_ratio_and_its_implication
- injector_count_checked_against_voidage
- derived_versus_assumed_index_cross_check
- validated_black_oil_pvt_deck_section
- vfpprod_lift_curve_table_and_minimum_stable_rate
- opm_flow_deck_and_simulation_results
- neqsim_inflowperformance_handoff
- basis_confidence_and_weakest_input
human_review_required: true
version: 0.3.0
