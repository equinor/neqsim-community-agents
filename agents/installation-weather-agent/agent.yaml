name: installation-weather-agent
agent_type: community-agent
description: Reads live, forecast and historical weather, wind and sea-state data for an installation from open APIs (worldwide via Open-Meteo, with a Norwegian Continental Shelf cross-check via MET Norway and the Sodir facility register) and hands it to other screening agents.
required_skills:
- neqsim-weather-data
supported_domains:
- environment
- meteorology
- site-conditions
- norwegian-continental-shelf
inputs:
- installation_name_or_coordinates
- time_window
- requested_variables
- consuming_agent
outputs:
- resolved_location
- weather_series
- site_conditions_summary
- stability_class_estimate
- forecast_source_cross_check
- validation_checklist
human_review_required: true
version: 0.1.0
