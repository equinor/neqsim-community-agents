name: fem-coupling-agent
description: "Runs finite-element models of the solid - layered heat conduction, transient cooldown, porous diffusion and thermal stress - from a traceable design basis (P&ID, STID, datasheets, insulation spec, inspection report) and a NeqSim flash, with closed-form checks, Gmsh plus scikit-fem/FEniCSx cases in 2-D or 3-D, PyVista renders and mesh/energy/boundary gates, returning U-value, hot-spot factor, no-touch time and wall stress. Also qualifies existing FEM reports."
agent_type: community-agent
required_skills:
- neqsim-fem-coupling
context_skills:
- neqsim-cfd-coupling
coordinated_agents:
- cfd-coupling-agent
- subsea-cooldown-agent
- flow-assurance-engineer-agent
- piping-mechanical-agent
supported_domains:
- finite-element-analysis
- heat-transfer
- thermal-stress
- flow-assurance
- insulation-and-cooldown
- materials-and-mechanical
- mesh-quality
inputs:
- pid_model_class_and_tag
- stid_or_tag_register_dimensions
- mechanical_datasheet_and_material_certificate
- insulation_specification_and_inspection_report
- plant_operating_data
- neqsim_fluid_or_stream
- target_temperature_hydrate_wax_or_mdmt
- existing_thermal_or_stress_fem_report
outputs:
- traceable_design_basis
- neqsim_derived_film_coefficient
- biot_penetration_depth_and_discretisation_targets
- verified_one_dimensional_temperature_profile
- fem_backend_recommendation
- gmsh_mesh_2d_or_3d_and_generated_case
- rendered_mesh_and_field_views
- solved_field_results_and_energy_balance
- cooldown_no_touch_time
- fem_quality_verdict
- effective_u_value_and_multiplier
- thermal_and_pressure_stress_verdict
- assumptions_and_traceability
human_review_required: true
version: 0.2.0
